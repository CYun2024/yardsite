plugins {
    id 'net.minecraftforge.gradle' version '6.0.43'
    id 'org.spongepowered.mixin' version '0.7.38'
}

def minecraft_version = project.property('minecraft_version')
def forge_version = project.property('forge_version')
def mixin_version = project.property('mixin_version')

// 版本号唯一来源：仓库根的 ../versions.properties（本外壳的 gradle.properties 里不再写一份）。
// 读不到直接失败，绝不静默回退 —— 否则会产出一个版本号错误、但看起来正常的 jar。
def versionsFile = file('../versions.properties')
if (!versionsFile.isFile()) {
    throw new GradleException("找不到 ${versionsFile} —— mod_version / mod_group 必须来自仓库根的 versions.properties")
}
def sharedVersions = new Properties()
versionsFile.withInputStream { sharedVersions.load(it) }
def mod_version = sharedVersions.getProperty('mod_version')
def mod_group = sharedVersions.getProperty('mod_group')
if (mod_version == null || mod_group == null) {
    throw new GradleException("${versionsFile} 缺 mod_version 或 mod_group")
}

group = mod_group
version = "${mod_version}+${minecraft_version}-forge"
base.archivesName = 'yardsite'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    // 源码全程 Mojmap（official），和核心/1.21.1 保持一致；生产环境由 ForgeGradle reobf
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                yardsite {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                yardsite {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'yardsite.refmap.json'
    config 'yardsite.forge.core.mixins.json'
    config 'yardsite.forge.mixins.json'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
}

// 1.20.1 的少量方法签名/API 与 1.21.1 不同。共享源码先复制到 build 目录做定点替换，
// 再和本工程的 Forge 平台代码一起编译；仓库里仍然只有上一级 common/src/main/java 一份源码
// （本工程嵌在 site 仓库里，monorepo 与独立仓库两种布局下 ../common/src/main/java 都成立）。
def generatedForgeSources = layout.buildDirectory.dir('generated/forge-src')
def generateForgeSources = tasks.register('generateForgeSources', Sync) {
    from('../common/src/main/java') {
        // 1.20.1 有专门替代实现的两个 mixin 不进来（common 里不再有加载器专属代码，无需排除平台包）
        exclude 'dev/yard/site/mixin/CameraMixin.java'
        exclude 'dev/yard/site/mixin/WorldOpenFlowsMixin.java'
    }
    into generatedForgeSources
    filter { line ->
        def out = line
                .replace('renderBackground(GuiGraphics g, int mouseX, int mouseY, float partialTick)',
                        'renderBackground(GuiGraphics g)')
                .replace('super.renderBackground(g, mouseX, mouseY, partialTick);',
                        'super.renderBackground(g);')
                // 1.20.1 的 Screen 不会自己调 renderBackground（1.20.2 起才会），
                // 屏幕在 render 里补的那一次要跟着换成单参数版本
                .replace('renderBackground(g, mouseX, mouseY, partialTick);',
                        'this.renderBackground(g);')
                .replace('mouseScrolled(double mouseX, double mouseY, double scrollX, double scrollY)',
                        'mouseScrolled(double mouseX, double mouseY, double scrollY)')
                .replace('super.mouseScrolled(mouseX, mouseY, scrollX, scrollY);',
                        'super.mouseScrolled(mouseX, mouseY, scrollY);')
                .replace('ResourceLocation.fromNamespaceAndPath("minecraft", "unknown")',
                        'ResourceLocation.tryParse("minecraft:unknown")')
                .replace('ResourceLocation.parse(', 'ResourceLocation.tryParse(')
                .replace('GameRules.RULE_SPAWN_CHUNK_RADIUS', 'GameRules.RULE_SPAWN_RADIUS')
                .replace('c.addVertex(', 'c.vertex(')
                .replace('drawMap(g, mouseX, mouseY);', 'drawMap(g, this.lastMouseX, this.lastMouseY);')
                .replace('getEyePosition(partialTick)', 'getEyePosition(lastPartialTick)')
                .replace('getViewYRot(partialTick)', 'getViewYRot(lastPartialTick)')
                .replace('getViewXRot(partialTick)', 'getViewXRot(lastPartialTick)')
        // 顶点颜色：1.20.1 叫 color(int)，但不要碰 SiteEditorPrefs.setColor 这种普通方法
        if (out.trim().startsWith('.setColor(')) {
            out = out.replace('.setColor(', '.color(')
        }
        out = out.replace(').setColor(', ').color(')
        // 1.20.1 的 BufferBuilder 必须 endVertex() 才计入顶点（1.21 起没这个方法）：
        // 取消费者的地方统一换成自动补 endVertex 的包装
        out = out.replace('return consumer;   // FORGE_WRAP',
                'return new dev.yard.site.platform.forge.EndVertexConsumer(consumer);')
        return out
    }
}

sourceSets {
    main {
        java {
            srcDir generateForgeSources
            srcDir 'src/main/java'
        }
        resources {
            // 共享资源只剩 assets/ 和 icon.png（mods.toml / pack.mcmeta / *mixins.json 各归外壳），
            // 所以这里不再需要 exclude 别家的加载器资源。
            srcDir '../common/src/main/resources'
            srcDir 'src/main/resources'
        }
    }
}

tasks.named('compileJava') {
    dependsOn generateForgeSources
}

// 替换规则写在 build.gradle 里，Gradle 不会把它当任务输入；每次都重生成，避免旧产物混进来
generateForgeSources.configure {
    outputs.upToDateWhen { false }
}

tasks.register('copyJarToDist', Copy) {
    dependsOn 'reobfJar'
    from(layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar', '*-javadoc.jar'
    }
    // 产物落点：monorepo 统一进 yard/dist；独立仓库（yardsite 根）进 <repo>/dist（已被 .gitignore 忽略）。
    // 这份 build 文件两种目录布局都要能跑，所以按"上一级三层的 yardcreator/settings.gradle.kts 在不在"判断。
    def forgeDir = rootProject.projectDir
    def threeUp = forgeDir.parentFile.parentFile.parentFile
    into(new File(threeUp, 'yardcreator/settings.gradle.kts').isFile()
            ? new File(threeUp, 'dist')
            : new File(forgeDir.parentFile, 'dist'))
}

tasks.named('build') {
    finalizedBy 'copyJarToDist'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.processResources {
    from '../LICENSE'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar.finalizedBy('reobfJar')
