org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Mixin AP 的 refmap 不是编译缓存的可靠输出，缓存命中时会丢，直接关掉
org.gradle.caching=false
# 本机 JDK 17 路径（作者环境；别人构建时改成自己的，或直接删掉这行让 Gradle 自动找/自动下载）
org.gradle.java.installations.paths=C:/MCDtools/zulu17.60.17-ca-jdk17.0.16-win_x64
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# 1.20.1 Forge 外壳自己的属性：只放「目标特有」的东西。
# 版本号不在这里 —— 一律来自仓库根的 ../versions.properties（唯一来源）。

minecraft_version=1.20.1
forge_version=47.3.0
mixin_version=0.8.5

# 国际链路间歇性重置：加大下载重试次数与退避
org.gradle.internal.repository.max.tentatives=15
org.gradle.internal.repository.initial.backoff=2000
