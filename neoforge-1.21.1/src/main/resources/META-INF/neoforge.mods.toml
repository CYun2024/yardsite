modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

[[mods]]
modId="yardsite"
# 不要在发布文件里手改版本号：构建时由 ../versions.properties 注入（见 build.gradle.kts 的 processResources）
version="@MOD_VERSION@"
displayName="Yard Site · 群系选区"
authors="CYun_CYER"
description='''创建单人世界前先看一张出生点附近的地形与群系图，把落点定准，再随一段落成镜头进世界。
单独安装时选出来的是出生点；同时安装庭院系列时，同一个落点会变成庭院占地；
指一份投影文件（.litematic / .nbt / .schem）时，同一个落点就是这栋建筑的位置——
线框按它的真实外壳画，进世界后由本 mod 铺方块。投影格式自带解析，不需要装投影 mod。'''

# 游戏内 mod 列表显示的小图标（jar 根目录的 icon.png，512×512 以上）
logoFile="icon.png"

[[mixins]]
config="yardsite.mixins.json"

[[dependencies.yardsite]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.yardsite]]
modId="minecraft"
type="required"
versionRange="[1.21,1.22)"
ordering="NONE"
side="BOTH"

# 可选联动：装了庭院核心时，选址结果交给它规划庭院；没有它就是独立的出生点选区
[[dependencies.yardsite]]
modId="yardcore"
type="optional"
versionRange="*"
ordering="AFTER"
side="BOTH"
