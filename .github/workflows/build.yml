name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Sodium 只是编译期依赖（不打包）：从 Modrinth 的 maven 取一份放进 libs/，
      # 这样 CI 出的 jar 和本地带 Sodium 钩子的那份一致。取不到也照样能编（那组 mixin 会跳过）。
      - name: Fetch Sodium (compile only)
        continue-on-error: true
        run: |
          mkdir -p libs
          curl -sSL --retry 3 -o "libs/sodium-neoforge-0.8.13+mc1.21.1-mod.jar" \
            "https://api.modrinth.com/maven/maven/modrinth/sodium/mc1.21.1-0.8.13-neoforge/sodium-mc1.21.1-0.8.13-neoforge.jar"

      - name: Build
        run: chmod +x gradlew && ./gradlew build --stacktrace --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: yardsite-jar
          path: build/libs/*.jar
          if-no-files-found: error

  # 打 tag（v0.1.0 这种）时自动建 Release 并挂 jar
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yardsite-jar
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
